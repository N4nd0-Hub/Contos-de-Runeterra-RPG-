<!DOCTYPE html>
<html lang="pt-BR" data-visual-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040d17">
<title>Contos de Runeterra · Ficha 2.0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='m12 2 9 5v10l-9 5-9-5V7Z' fill='%23040d17' stroke='%23c8aa6e' stroke-width='1.5'/%3E%3Cpath d='m12 7 4 5-4 5-4-5Z' fill='%230ac8b9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Cinzel:wght@500;600;700;800&family=Marcellus&family=Nunito+Sans:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=2.0.0">
<link rel="stylesheet" href="css/themes.css?v=2.0.0">
<link rel="stylesheet" href="css/fx.css?v=2.0.0">
</head>
<body>
<header class="topbar">
 <button class="icon-btn" id="drawerBtn" type="button" aria-label="Personagens" title="Personagens"></button>
 <div class="brand"><span class="brand-mark" id="brandMark"></span><div><div class="brand-title" id="brandTitle">Runearcana</div><span class="brand-sub" id="brandSub"></span></div></div>
 <span class="save-indicator ok" id="saveIndicator">salvo</span>
 <div class="top-actions">
  <div class="mode-wrap"><button class="btn" id="modeBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
   <section class="mode-picker" id="modePicker" hidden aria-label="Modalidade da ficha"></section></div>
  <button class="btn" id="appearanceBtn" type="button"></button>
  <button class="btn hide-sm" id="exportBtn" type="button"></button>
  <label class="btn hide-sm" id="importBtn"><input type="file" accept="application/json,.json" hidden id="importFile"></label>
  <button class="btn primary" id="newCharBtn" type="button"></button>
 </div>
</header>
<aside class="drawer" id="drawer" aria-label="Personagens" hidden>
 <div class="drawer-head"><h2>Companhia</h2><button class="btn sm ghost" id="drawerClose" type="button">Fechar</button></div>
 <div class="drawer-list" id="characterList"></div>
 <div class="drawer-foot">
  <button class="btn" id="exportBtn2" type="button"></button>
  <label class="btn" id="importBtn2"><input type="file" accept="application/json,.json" hidden id="importFile2"></label>
  <button class="btn danger" id="deleteCharBtn" type="button"></button>
 </div>
</aside>
<div class="drawer-scrim" id="drawerScrim" hidden></div>
<main class="app">
 <article class="sheet" id="sheet">
  <header class="sheet-head" id="sheetHead"></header>
  <nav class="tabs" id="tabs" aria-label="Páginas da ficha"></nav>
  <div class="pages" id="pages"></div>
 </article>
 <footer class="credits">Contos de Runeterra · Sistema 2.0, por Luiz Fernando. Projeto de fãs, sem vínculo com a Riot Games ou a Blizzard. Ícones de <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a> (CC BY 3.0) e <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a>. Imagens das runas: League of Legends via CommunityDragon.</footer>
</main>
<div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" type="button" aria-label="Fechar"></button></header><div class="modal-body" id="modalBody"></div></section></div>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<script src="js/icons.js?v=2.0.0"></script>
<script src="js/rules.js?v=2.0.0"></script>
<script src="js/book.js?v=2.0.0"></script>
<script src="js/store.js?v=2.0.0"></script>
<script src="js/calc.js?v=2.0.0"></script>
<script src="js/ui.js?v=2.0.0"></script>
<script src="js/pages-perfil.js?v=2.0.0"></script>
<script src="js/pages-combate.js?v=2.0.0"></script>
<script src="js/pages-kit.js?v=2.0.0"></script>
<script src="js/pages-runas.js?v=2.0.0"></script>
<script src="js/pages-extra.js?v=2.0.0"></script>
<script src="js/appearance.js?v=2.0.0"></script>
<script src="js/dice.js?v=2.0.0"></script>
<script src="js/fx.js?v=2.0.0"></script>
<script src="js/app.js?v=2.0.0"></script>
</body>
</html>
